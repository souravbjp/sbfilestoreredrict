<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Telegram...</title>
    <script>
        // নিচে আপনার বটের ইউজারনেম দিন (বিনা @ তে)
        const botUsername = "AlyaFile1Bot";

        // ইউজারের ক্লিক করা লিংক থেকে 'start' এর ভেতরের কোডটা বের করা
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start');

        if (startParam) {
            // রিডাইরেক্ট লিংক তৈরি
            const tgUrl = `tg://resolve?domain=${botUsername}&start=${startParam}`;
            const webUrl = `https://t.me/${botUsername}?start=${startParam}`;
            
            // ইনস্ট্যান্ট রিডাইরেক্ট (0.01 সেকেন্ডের মধ্যে)
            window.location.replace(tgUrl);
            
            // যদি ইউজারের ফোনে টেলিগ্রাম অ্যাপ ওপেন না হয়, তবে ব্যাকআপ ওয়েব লিংক
            setTimeout(function() {
                window.location.replace(webUrl);
            }, 500);
        }
    </script>
</head>
<body>
    <h3 style="text-align: center; font-family: sans-serif; margin-top: 50px;">
        Redirecting to Telegram in 0.01s... 🚀
    </h3>
    <script>
        // start প্যারামিটার না থাকলে যা দেখাবে
        if (!startParam) {
            document.body.innerHTML = '<h3 style="text-align: center; font-family: sans-serif; margin-top: 50px; color: green;">✅ Telegram Redirect Page is Active!</h3>';
        }
    </script>
</body>
</html>
